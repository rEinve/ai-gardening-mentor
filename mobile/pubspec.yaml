name: ai_gardening_mentor
description: AI Gardening Mentor — Tanzania MVP hybrid Flutter client (Android, iOS, Web, Desktop).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase Core + Firebase AI Logic + Auth + App Check + Remote Config
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  firebase_ai: ^2.0.0
  firebase_app_check: ^0.3.1+7
  firebase_remote_config: ^5.1.6
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.5
  firebase_storage: ^12.3.6
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
